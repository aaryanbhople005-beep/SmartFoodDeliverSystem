<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartFood — Sign In</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
  <div class="container">
    <a href="index.html" class="brand"><div class="mark">SF</div><span>SmartFood</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="restaurants.html">Restaurants</a>
      <div id="nav-guest-links" style="display:flex;gap:8px;align-items:center;">
        <a href="sign-in.html" class="active">Sign In</a>
        <a href="sign-up.html">Sign Up</a>
      </div>
      <div id="nav-user-links" style="display:none;gap:8px;align-items:center;">
        <span id="nav-user-name" style="color:var(--text-muted);">User</span>
        <a href="#" id="nav-logout" style="color:var(--primary);">Sign Out</a>
      </div>
      <a href="cart.html" class="cart-link">Cart <span class="cart-badge" id="cart-badge">0</span></a>
    </div>
  </div>
</nav>

<section class="section">
  <div class="container" style="max-width:460px;">
    <h2 class="section-title" style="text-align:left;">Sign <span>In</span></h2>

    <div id="signin-server-error" style="color:var(--primary);font-size:0.9rem;margin-bottom:12px;display:none;"></div>

    <form id="signin-form" style="background:#fff;border:1px solid var(--gray);border-radius:var(--radius);padding:24px;">
      <div class="form-group">
        <label>Email or Username</label>
        <input type="text" id="signin-username" placeholder="e.g. aarav@example.com" required>
        <div id="signin-username-error" style="color:var(--primary);font-size:0.85rem;margin-top:6px;"></div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signin-password" placeholder="••••••••" required>
        <div id="signin-password-error" style="color:var(--primary);font-size:0.85rem;margin-top:6px;"></div>
      </div>

      <div id="signin-server-error" style="color:var(--primary);font-size:0.9rem;margin-bottom:12px;display:none;"></div>

      <button type="submit" class="btn btn-primary btn-full" id="signin-submit">Sign In</button>
    </form>

    <p style="text-align:center;color:var(--text-muted);font-size:0.9rem;margin-top:16px;">
      Don't have an account? <a href="sign-up.html" style="color:var(--primary);font-weight:700;">Sign Up</a>
    </p>
    <p style="text-align:center;color:var(--text-muted);font-size:0.9rem;">
      <a href="index.html" style="color:var(--primary);font-weight:700;">&larr; Back to Home</a>
    </p>
  </div>
</section>

<footer>
  <div class="container">
    <div class="brand"><div class="mark" style="background:var(--accent);color:var(--dark);">SF</div><span>SmartFood</span></div>
    <p>SmartFoodDeliverySystem &middot; Design Pattern Lab Project</p>
  </div>
</footer>

<script type="module">
  import { login } from "./js/app.js";

  (function () {
    const form = document.getElementById("signin-form");
    const username = document.getElementById("signin-username");
    const password = document.getElementById("signin-password");
    const serverError = document.getElementById("signin-server-error");
    const submit = document.getElementById("signin-submit");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      serverError.style.display = "none";
      if (!username.value.trim()) {
        serverError.textContent = "Email or username is required.";
        serverError.style.display = "block";
        return;
      }
      if (!password.value) {
        serverError.textContent = "Password is required.";
        serverError.style.display = "block";
        return;
      }
      submit.disabled = true;
      submit.textContent = "Signing in...";
      try {
        await login(username.value.trim(), password.value);
        location.href = "index.html";
      } catch (err) {
        serverError.textContent = err.message || "Sign in failed.";
        serverError.style.display = "block";
        submit.disabled = false;
        submit.textContent = "Sign In";
      }
    });
  })();
</script>
</body>
</html>
