<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartFood — Sign Up</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
  <div class="container">
    <a href="index.html" class="brand"><div class="mark">SF</div><span>SmartFood</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="restaurants.html">Restaurants</a>
      <div id="nav-guest-links" style="display:flex;gap:8px;align-items:center;">
        <a href="sign-in.html">Sign In</a>
        <a href="sign-up.html" class="active">Sign Up</a>
      </div>
      <div id="nav-user-links" style="display:none;gap:8px;align-items:center;">
        <span id="nav-user-name" style="color:var(--text-muted);">User</span>
        <a href="#" id="nav-logout" style="color:var(--primary);">Sign Out</a>
      </div>
      <a href="cart.html" class="cart-link">Cart <span class="cart-badge" id="cart-badge">0</span></a>
    </div>
  </div>
</nav>

<section class="section">
  <div class="container" style="max-width:460px;">
    <h2 class="section-title" style="text-align:left;">Sign <span>Up</span></h2>

    <div id="signup-server-error" style="color:var(--primary);font-size:0.9rem;margin-bottom:12px;display:none;"></div>

    <form id="signup-form" style="background:#fff;border:1px solid var(--gray);border-radius:var(--radius);padding:24px;">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="signup-name" placeholder="e.g. Aarav Sharma" required>
        <div id="signup-name-error" style="color:var(--primary);font-size:0.85rem;margin-top:6px;"></div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signup-email" placeholder="e.g. aarav@example.com" required>
        <div id="signup-email-error" style="color:var(--primary);font-size:0.85rem;margin-top:6px;"></div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signup-password" placeholder="••••••••" required>
        <div id="signup-password-error" style="color:var(--primary);font-size:0.85rem;margin-top:6px;"></div>
      </div>

      <div id="signup-server-error" style="color:var(--primary);font-size:0.9rem;margin-bottom:12px;display:none;"></div>

      <button type="submit" class="btn btn-primary btn-full" id="signup-submit">Create Account</button>
    </form>

    <p style="text-align:center;color:var(--text-muted);font-size:0.9rem;margin-top:16px;">
      Already have an account? <a href="sign-in.html" style="color:var(--primary);font-weight:700;">Sign In</a>
    </p>
    <p style="text-align:center;color:var(--text-muted);font-size:0.9rem;">
      <a href="index.html" style="color:var(--primary);font-weight:700;">&larr; Back to Home</a>
    </p>
  </div>
</section>

<footer>
  <div class="container">
    <div class="brand"><div class="mark" style="background:var(--accent);color:var(--dark);">SF</div><span>SmartFood</span></div>
    <p>SmartFoodDeliverySystem &middot; Design Pattern Lab Project</p>
  </div>
</footer>

<script type="module">
  import { register, toast } from "./js/app.js";

  (function () {
    const form = document.getElementById("signup-form");
    const name = document.getElementById("signup-name");
    const email = document.getElementById("signup-email");
    const password = document.getElementById("signup-password");
    const nameError = document.getElementById("signup-name-error");
    const emailError = document.getElementById("signup-email-error");
    const passwordError = document.getElementById("signup-password-error");
    const serverError = document.getElementById("signup-server-error");
    const submit = document.getElementById("signup-submit");

    function clearErrors() {
      nameError.textContent = "";
      emailError.textContent = "";
      passwordError.textContent = "";
      serverError.style.display = "none";
    }

    function showServerError(msg) {
      serverError.textContent = msg;
      serverError.style.display = "block";
    }

    function isValidEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearErrors();
      let valid = true;
      if (!name.value.trim()) {
        nameError.textContent = "Full name is required.";
        valid = false;
      }
      if (!email.value.trim()) {
        emailError.textContent = "Email is required.";
        valid = false;
      } else if (!isValidEmail(email.value.trim())) {
        emailError.textContent = "Please enter a valid email address.";
        valid = false;
      }
      if (!password.value) {
        passwordError.textContent = "Password is required.";
        valid = false;
      } else if (password.value.length < 6) {
        passwordError.textContent = "Password must be at least 6 characters.";
        valid = false;
      }
      if (!valid) return;

      submit.disabled = true;
      submit.textContent = "Creating account...";
      try {
        await register(name.value.trim(), email.value.trim(), password.value);
        toast("Account created. Please sign in.", "success");
        location.href = "sign-in.html";
      } catch (err) {
        showServerError(err.message || "Registration failed.");
        submit.disabled = false;
        submit.textContent = "Create Account";
      }
    });
  })();
</script>
</body>
</html>
